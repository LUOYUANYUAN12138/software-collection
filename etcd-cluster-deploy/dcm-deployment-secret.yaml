# DCM Deployment - 挂载 etcd 客户端证书 Secret
#
# 适用场景：etcd 集群开启了 TLS，dcm 镜像构建时没有 COPY 证书（构建机不可达），
# 通过 K8s Secret + VolumeMount 把证书注入到 Pod 中。
#
# 前置条件：
#   1. 已创建 Secret（命令如下，或在 CCE 控制台手动创建）
#      kubectl create secret generic etcd-client-certs \
#        --from-file=ca.pem=./ca.pem \
#        --from-file=client.pem=./client.pem \
#        --from-file=client-key.pem=./client-key.pem \
#        -n ccs-tenant
#
#   2. 三个证书文件：ca.pem / client.pem / client-key.pem
#
# 部署后验证：
#   kubectl exec -it <dcm-pod> -n ccs-tenant -- ls -la /opt/cloud/etcdclient/
#   # 应看到 ca.pem / client.pem / client-key.pem
#
# 注意：
#   - 此 YAML 仅展示 Secret 挂载相关配置，实际使用时在现有 Deployment YAML 基础上追加
#   - 挂载路径 /opt/cloud/etcdclient 是 dcm 默认的证书读取路径，如有不同请改 mountPath
#   - 如果 Deployment 由 CI/CD 流水线管理，手动修改后需同步到流水线模板

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcm
  namespace: ccs-tenant
  labels:
    app: dcm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dcm
  template:
    metadata:
      labels:
        app: dcm
    spec:
      containers:
        - name: dcm
          image: your-registry/dcm:latest        # ← 改成实际镜像
          imagePullPolicy: Always
          ports:
            - containerPort: 8080                 # ← 改成实际端口
          
          # ============ 原有环境变量保持不动 ============
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # ... 其他原有 env ...
          
          # ============ 原有资源限制保持不动 ============
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          
          # ==========================================
          # ★ 新增①：挂载 Secret 到容器内目录
          # 和 image / env / ports / resources 同级
          # ==========================================
          volumeMounts:
            - name: etcd-certs                    # 卷名，要和下面 volumes 的 name 对应
              mountPath: /opt/cloud/etcdclient    # 容器内挂载路径（dcm 读证书的位置）
              readOnly: true                      # 证书只读

      # ==========================================
      # ★ 新增②：声明 Secret 卷
      # 和 containers 同级（都在 spec.template.spec 下）
      # 如果原来已有 volumes，在下面追加即可
      # ==========================================
      volumes:
        - name: etcd-certs                        # 卷名，和上面 volumeMounts 的 name 对应
          secret:
            secretName: etcd-client-certs         # ← 指向已创建的 Secret 名称
            # 默认会把 Secret 里的所有 key 都挂载进去
            # 如果 Secret 的 key 和文件名不一样，可以用 items 指定映射：
            # items:
            #   - key: ca.pem
            #     path: ca.pem
            #   - key: client.pem
            #     path: client.pem
            #   - key: client-key.pem
            #     path: client-key.pem
